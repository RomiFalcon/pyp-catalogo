<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catálogo Mayorista · P&P Distribuidora</title>
<link rel="stylesheet" href="colors_and_type.css">
<style>
  *{box-sizing:border-box;}
  html,body{margin:0;background:var(--pp-cream);font-family:var(--pp-font-brand);color:var(--pp-brown-800);-webkit-font-smoothing:antialiased;}
  #root{min-height:100vh;}
  button{font-family:inherit;}
  ::selection{background:var(--pp-orange-300);color:var(--pp-brown-900);}

  /* ---------- header ---------- */
  .pp-header{position:sticky;top:0;z-index:30;background:rgba(245,236,219,.92);backdrop-filter:blur(12px);
    border-bottom:1.5px solid var(--pp-cream-300);}
  .pp-header__inner{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:20px;padding:14px 24px;}
  .pp-brand{display:flex;align-items:center;gap:12px;flex:none;}
  .pp-brand img{height:46px;}
  .pp-brand__name{font-weight:700;font-size:19px;color:var(--pp-brown-900);line-height:1.05;}
  .pp-brand__sub{font-size:12.5px;color:var(--pp-ink-soft);margin-top:1px;}
  .pp-search{flex:1;max-width:460px;display:flex;align-items:center;gap:10px;background:#fff;border:2px solid var(--pp-cream-300);
    border-radius:var(--pp-radius-pill);padding:11px 18px;transition:border-color .18s;}
  .pp-search:focus-within{border-color:var(--pp-terracotta);}
  .pp-search i{width:19px;height:19px;color:var(--pp-ink-soft);flex:none;}
  .pp-search input{border:none;outline:none;background:none;flex:1;font-size:15px;color:var(--pp-brown-900);}
  .pp-search button{border:none;background:none;cursor:pointer;color:var(--pp-ink-soft);display:flex;padding:0;}
  .pp-search button i{width:17px;height:17px;}
  .pp-orderbtn{position:relative;display:flex;align-items:center;gap:9px;background:var(--pp-terracotta);color:#fff;border:none;
    cursor:pointer;font-weight:600;font-size:15px;border-radius:var(--pp-radius-pill);padding:12px 22px;box-shadow:var(--pp-shadow-sm);
    transition:background .18s,transform .12s;flex:none;}
  .pp-orderbtn:hover{background:var(--pp-terracotta-600);}
  .pp-orderbtn:active{transform:scale(.97);}
  .pp-orderbtn i{width:20px;height:20px;}
  .pp-orderbtn__badge{position:absolute;top:-6px;right:-6px;background:var(--pp-brown-900);color:#fff;font-size:12px;font-weight:700;
    min-width:22px;height:22px;border-radius:11px;display:flex;align-items:center;justify-content:center;padding:0 6px;border:2px solid var(--pp-cream);}

  /* ---------- category nav ---------- */
  .pp-cats{max-width:1240px;margin:0 auto;display:flex;gap:9px;padding:0 24px 14px;overflow-x:auto;scrollbar-width:none;}
  .pp-cats::-webkit-scrollbar{display:none;}
  .pp-chip{display:inline-flex;align-items:center;gap:8px;white-space:nowrap;cursor:pointer;font-weight:600;font-size:14px;
    border:2px solid var(--pp-cream-300);background:transparent;color:var(--pp-brown-700);border-radius:var(--pp-radius-pill);
    padding:9px 18px;transition:all .16s;}
  .pp-chip i{width:16px;height:16px;}
  .pp-chip:hover{border-color:var(--pp-terracotta);color:var(--pp-terracotta);}
  .pp-chip.on{background:var(--pp-terracotta);border-color:var(--pp-terracotta);color:#fff;}

  /* ---------- hero ---------- */
  .pp-hero{max-width:1240px;margin:0 auto;padding:40px 24px 8px;display:flex;gap:40px;align-items:center;justify-content:space-between;flex-wrap:wrap;}
  .pp-hero__text{max-width:660px;}
  .pp-eyebrow{font-weight:600;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--pp-terracotta);}
  .pp-hero h1{font-weight:700;font-size:clamp(34px,5vw,54px);line-height:1.04;margin:12px 0 14px;color:var(--pp-brown-900);}
  .pp-hero h1 span{color:var(--pp-terracotta);}
  .pp-hero p{font-size:17px;line-height:1.55;color:var(--pp-ink-soft);margin:0;max-width:600px;}
  .pp-hero__stats{display:flex;gap:14px;}
  .pp-hero__stats div{background:var(--pp-cream-card);border:1.5px solid var(--pp-cream-300);border-radius:var(--pp-radius-lg);
    padding:18px 22px;text-align:center;min-width:96px;}
  .pp-hero__stats strong{display:block;font-size:32px;font-weight:700;color:var(--pp-terracotta);line-height:1;}
  .pp-hero__stats span{font-size:13px;color:var(--pp-ink-soft);margin-top:5px;display:block;}

  /* ---------- main / sections ---------- */
  .pp-main{max-width:1240px;margin:0 auto;padding:24px 24px 60px;}
  .pp-section{margin-top:38px;scroll-margin-top:150px;}
  .pp-section__head{display:flex;align-items:center;gap:16px;margin-bottom:18px;}
  .pp-section__icon{width:52px;height:52px;flex:none;border-radius:16px;background:var(--pp-terracotta);display:flex;align-items:center;justify-content:center;}
  .pp-section__icon i{width:26px;height:26px;color:#fff;}
  .pp-section__head h2{margin:0;font-size:26px;font-weight:700;color:var(--pp-brown-900);}
  .pp-section__head p{margin:2px 0 0;font-size:14.5px;color:var(--pp-ink-soft);}
  .pp-section__count{margin-left:auto;font-weight:700;font-size:14px;color:var(--pp-brown-600);background:var(--pp-cream-card);
    border:1.5px solid var(--pp-cream-300);border-radius:var(--pp-radius-pill);padding:5px 14px;}

  .pp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px;}

  /* ---------- product card ---------- */
  .pp-card{background:var(--pp-cream-card);border:1.5px solid var(--pp-cream-300);border-radius:var(--pp-radius-lg);
    overflow:hidden;display:flex;flex-direction:column;transition:transform .16s var(--pp-ease-out),box-shadow .16s,border-color .16s;}
  .pp-card:hover{transform:translateY(-4px);box-shadow:var(--pp-shadow-md);border-color:var(--pp-cream-300);}
  .pp-card__media{position:relative;background:#fff;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;padding:14px;border-bottom:1.5px solid var(--pp-cream-200);}
  .pp-card__media img{max-width:100%;max-height:100%;object-fit:contain;mix-blend-mode:multiply;}
  .pp-ph{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--pp-cream-300);}
  .pp-ph i{width:40px;height:40px;}
  .pp-ph span{font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--pp-brown-600);opacity:.55;}
  .pp-brandtag{position:absolute;top:12px;left:12px;background:rgba(52,25,11,.86);color:#fff;font-size:11px;font-weight:600;
    letter-spacing:.04em;text-transform:uppercase;padding:5px 11px;border-radius:var(--pp-radius-pill);backdrop-filter:blur(2px);}
  .pp-card__body{padding:14px 16px 6px;flex:1;}
  .pp-card__name{margin:0;font-size:16.5px;font-weight:600;line-height:1.22;color:var(--pp-brown-900);}
  .pp-card__price{margin:5px 0 0;font-size:15px;font-weight:700;color:var(--pp-terracotta);}
  .pp-card__desc{margin:7px 0 0;font-size:13.5px;line-height:1.4;color:var(--pp-ink-soft);}
  .pp-variants{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px;}
  .pp-vchip{font-size:12px;font-weight:600;cursor:pointer;color:var(--pp-brown-700);background:#fff;border:1.5px solid var(--pp-cream-300);
    border-radius:var(--pp-radius-pill);padding:5px 11px;transition:all .14s;}
  .pp-vchip:hover{border-color:var(--pp-terracotta);color:var(--pp-terracotta);}
  .pp-vchip.on{background:var(--pp-terracotta);border-color:var(--pp-terracotta);color:#fff;}
  .pp-card__tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px;}
  .pp-tag{font-size:11px;font-weight:600;color:var(--pp-leaf-700);background:rgba(94,140,58,.12);border-radius:var(--pp-radius-pill);padding:4px 10px;}
  .pp-card__foot{padding:12px 16px 16px;}
  .pp-add{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;background:var(--pp-terracotta);color:#fff;border:none;
    cursor:pointer;font-weight:600;font-size:14.5px;border-radius:var(--pp-radius-pill);padding:11px;transition:background .16s,transform .1s;}
  .pp-add:hover{background:var(--pp-terracotta-600);}
  .pp-add:active{transform:scale(.97);}
  .pp-add i{width:18px;height:18px;}

  .pp-stepper{display:flex;align-items:center;justify-content:space-between;background:#fff;border:2px solid var(--pp-terracotta);
    border-radius:var(--pp-radius-pill);padding:4px;}
  .pp-stepper button{width:38px;height:38px;border:none;border-radius:50%;background:var(--pp-terracotta);color:#fff;cursor:pointer;
    display:flex;align-items:center;justify-content:center;transition:background .14s,transform .1s;}
  .pp-stepper button:hover{background:var(--pp-terracotta-600);}
  .pp-stepper button:active{transform:scale(.9);}
  .pp-stepper button i{width:18px;height:18px;}
  .pp-stepper span{font-weight:700;font-size:17px;color:var(--pp-brown-900);min-width:30px;text-align:center;}
  .pp-stepper.sm button{width:30px;height:30px;}
  .pp-stepper.sm button i{width:15px;height:15px;}
  .pp-stepper.sm span{font-size:15px;min-width:24px;}

  /* ---------- no results ---------- */
  .pp-noresults,.pp-empty{text-align:center;color:var(--pp-ink-soft);padding:60px 20px;}
  .pp-noresults i{width:46px;height:46px;color:var(--pp-cream-300);}
  .pp-noresults p{margin-top:14px;font-size:16px;}

  /* ---------- footer ---------- */
  .pp-footer{background:var(--pp-terracotta);display:flex;flex-wrap:wrap;justify-content:center;gap:14px 56px;padding:34px 24px;}
  .pp-footer__blk{display:flex;align-items:center;gap:14px;color:#fff;font-size:15px;line-height:1.25;}
  .pp-footer__blk i{width:32px;height:32px;flex:none;}
  .pp-footer__blk b{font-weight:700;}

  /* ---------- FAB ---------- */
  .pp-fab{display:none;position:fixed;left:50%;transform:translateX(-50%);bottom:18px;z-index:25;background:var(--pp-brown-900);
    color:#fff;border:none;cursor:pointer;font-weight:600;font-size:15px;border-radius:var(--pp-radius-pill);padding:14px 26px;
    box-shadow:var(--pp-shadow-lg);align-items:center;gap:9px;}
  .pp-fab i{width:19px;height:19px;}

  /* ---------- drawer ---------- */
  .pp-scrim{position:fixed;inset:0;background:rgba(52,25,11,.5);opacity:0;pointer-events:none;transition:opacity .26s;z-index:40;backdrop-filter:blur(2px);}
  .pp-scrim.on{opacity:1;pointer-events:auto;}
  .pp-drawer{position:fixed;top:0;right:0;height:100%;width:420px;max-width:92vw;background:var(--pp-cream);z-index:50;
    transform:translateX(100%);transition:transform .3s var(--pp-ease-out);display:flex;flex-direction:column;box-shadow:var(--pp-shadow-lg);}
  .pp-drawer.on{transform:translateX(0);}
  .pp-drawer__head{display:flex;align-items:center;justify-content:space-between;padding:22px 22px 16px;border-bottom:1.5px solid var(--pp-cream-300);}
  .pp-drawer__title{font-size:22px;font-weight:700;color:var(--pp-brown-900);}
  .pp-drawer__sub{font-size:13.5px;color:var(--pp-ink-soft);margin-top:2px;}
  .pp-iconbtn{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--pp-cream-300);background:#fff;cursor:pointer;
    display:flex;align-items:center;justify-content:center;color:var(--pp-brown-700);}
  .pp-iconbtn i{width:20px;height:20px;}
  .pp-drawer__body{flex:1;overflow-y:auto;padding:14px 22px;}
  .pp-empty i{width:48px;height:48px;color:var(--pp-cream-300);}
  .pp-empty p{margin-top:14px;line-height:1.5;}
  .pp-line{display:flex;align-items:center;gap:13px;padding:12px 0;border-bottom:1.5px dashed var(--pp-cream-300);}
  .pp-line img{width:56px;height:56px;border-radius:12px;object-fit:contain;background:#fff;border:1.5px solid var(--pp-cream-200);padding:4px;mix-blend-mode:multiply;}
  .pp-line__ph{width:56px;height:56px;flex:none;border-radius:12px;background:#fff;border:1.5px solid var(--pp-cream-200);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:20px;color:var(--pp-brown-600);opacity:.7;}
  .pp-line__var{color:var(--pp-terracotta);font-weight:600;}
  .pp-line__info{flex:1;min-width:0;}
  .pp-line__name{font-weight:600;font-size:14.5px;color:var(--pp-brown-900);line-height:1.25;}
  .pp-line__brand{font-size:12.5px;color:var(--pp-ink-soft);margin-top:2px;}
  .pp-line__price{font-size:12.5px;color:var(--pp-brown-700);margin-top:2px;}
  .pp-line__price b{color:var(--pp-terracotta);}
  .pp-total{display:flex;align-items:center;justify-content:space-between;font-size:15.5px;font-weight:600;
    color:var(--pp-brown-900);padding:2px 2px 14px;}
  .pp-total strong{font-size:20px;font-weight:700;color:var(--pp-terracotta);}
  .pp-drawer__foot{padding:18px 22px;border-top:1.5px solid var(--pp-cream-300);background:var(--pp-cream-card);}
  .pp-field{margin-bottom:11px;}
  .pp-field label{display:block;font-size:12.5px;font-weight:600;color:var(--pp-brown-700);margin-bottom:5px;}
  .pp-field input,.pp-field textarea{width:100%;border:2px solid var(--pp-cream-300);border-radius:12px;padding:10px 14px;font-size:14.5px;
    color:var(--pp-brown-900);background:#fff;outline:none;transition:border-color .16s;}
  .pp-field textarea{font-family:inherit;resize:vertical;min-height:60px;}
  .pp-field input:focus,.pp-field textarea:focus{border-color:var(--pp-terracotta);}
  .pp-wa{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;background:#1FA855;color:#fff;border:none;text-decoration:none;box-sizing:border-box;
    cursor:pointer;font-weight:700;font-size:16px;border-radius:var(--pp-radius-pill);padding:14px;margin-top:6px;
    box-shadow:var(--pp-shadow-sm);transition:background .16s,transform .1s;}
  .pp-wa:hover{background:#178a45;}
  .pp-wa:active{transform:scale(.98);}
  .pp-wa i{width:21px;height:21px;}
  .pp-clear{width:100%;background:none;border:none;cursor:pointer;color:var(--pp-ink-soft);font-size:13.5px;font-weight:600;
    padding:10px;margin-top:4px;text-decoration:underline;}
  .pp-note{font-size:12px;color:var(--pp-ink-soft);text-align:center;margin:6px 0 0;line-height:1.4;}

  /* ---------- responsive ---------- */
  @media (max-width:720px){
    .pp-header__inner{flex-wrap:wrap;gap:12px;}
    .pp-search{order:3;max-width:none;flex-basis:100%;}
    .pp-brand{flex:1;}
    .pp-orderbtn span:not(.pp-orderbtn__badge){display:none;}
    .pp-orderbtn{padding:12px;}
    .pp-hero__stats{width:100%;}
    .pp-hero__stats div{flex:1;}
    .pp-fab{display:flex;}
    .pp-grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important;}}
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>
<script src="catalog/products.js"></script>
<script type="text/babel" src="catalog/CatalogApp.jsx"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script>window.addEventListener("load", () => setTimeout(() => lucide.createIcons(), 250));</script>
</body>
</html>
